name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin manifests
        run: perl tools/validate_all.pl
      - name: Run tests
        run: perl -MTest::Harness -e 'runtests sort glob(q(t/*.t))'
